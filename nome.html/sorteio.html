<!DOCTYPE html>
<html>
    <body>

        <h1>Sorteio</h1>
        <h2>Ganhe 20 euros!</h2>

        <p>Clique para roletar</p>

        <button onclick="sorte()">jogar</button>
        <button onclick="parar()">parar</button>

        <p>
            <span id="dn1" class="bignumber"></span>
            <span id="dn2" class="bignumber"></span>
            <span id="dn3" class="bignumber"></span>
        </p>

        <script>
            const dn1 = document.getElementById('dn1')
            const dn2 = document.getElementById('dn2')
            const dn3 = document.getElementById('dn3')
            let mytimer
            let timeout = 0
            let n1
            let n2
            let n3

            function sorte() {
                n1 = Math.round(Math.random() * 9)
                n2 = Math.round(Math.random() * 9)
                n3 = Math.round(Math.random() * 9)
                dn1.innerHTML = n1
                dn2.innerHTML = n2
                dn3.innerHTML = n3
                timeout = timeout + 25
                if ( timeout < 100) {
                    mytimer = setTimeout(sorte, timeout)
                } else {
                    parar()
                }
            }

            function parar() {
                clearTimeout(mytimer);
                timeout = 0
                if ( n1 = n2 = n3) {
                    console.log("ganhou")
                } else {
                   console.log("perdeu")
                }
            }

            </script>
            <style>
            bigumber {
                font-family: 'digital-clock-font';
                font-size: xx-large;
                letter-spacing: lem;
            }
            @font-face{
                font-family: 'digital-clock-font';
                scr: url('digital-7-mono.ttf')
            }
        </style>

        <div>
            <p> <a href="index.html">
                <img src="return.png" alt="" style="width: 3em; display: inline-block;">
            </a></p>
        </div>

    </body>
</html>
